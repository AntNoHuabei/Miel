version: '3'

vars:
  APP_NAME: "miel"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: Builds Miel for Windows with CGO enabled
    cmds:
      - task: windows:build

  package:
    summary: Packages the Windows production build
    cmds:
      - task: windows:package

  run:
    summary: Runs the Windows application
    cmds:
      - task: windows:run

  dev:
    summary: Runs Miel in Windows development mode
    cmds:
      - task: windows:dev
